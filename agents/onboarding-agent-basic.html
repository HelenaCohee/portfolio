<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Onboarding Assistant — Basic Agent Demo</title>
<style>
  :root {
    --bg: #0b1220;
    --panel: #0e1626;
    --line: #21304d;
    --line2: #243353;
    --text: #e8edf6;
    --muted: #8aa0c4;
    --blue: #2f6df0;
    --green: #3ddc97;
    --amber: #ffcf6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(1200px 600px at 80% -10%, #1b2a4a 0%, #0b1220 55%);
    color: var(--text);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
    gap: 16px;
  }
  .card {
    width: 100%; max-width: 620px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.5);
  }
  .header {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 20px;
    background: linear-gradient(90deg,#13203a,#0e1626);
    border-bottom: 1px solid var(--line);
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--green); box-shadow: 0 0 12px var(--green); }
  .h-title { font-weight: 700; font-size: 16px; }
  .h-sub { font-size: 12px; color: var(--muted); }
  .badge {
    margin-left: auto; font-size: 11px; font-weight: 700; letter-spacing: 1px;
    color: #9fb4d6; border: 1px solid #2b3c5e; border-radius: 999px; padding: 4px 10px;
  }
  .chat { height: 400px; overflow-y: auto; padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; animation: fade .25s ease; }
  .row.user { justify-content: flex-end; }
  .row.bot { justify-content: flex-start; }
  .bubble { max-width: 82%; padding: 11px 14px; border-radius: 14px; font-size: 14.5px; line-height: 1.5; }
  .user .bubble { background: var(--blue); color: #fff; border-bottom-right-radius: 4px; }
  .bot .bubble { background: #16223a; color: #dce6f7; border: 1px solid var(--line2); border-bottom-left-radius: 4px; }
  .tag { display: inline-block; margin-top: 8px; font-size: 11px; border-radius: 6px; padding: 3px 8px; }
  .tag.source { color: #7fd1a9; background: rgba(61,220,151,.08); border: 1px solid rgba(61,220,151,.25); }
  .tag.handoff { color: var(--amber); background: rgba(255,207,107,.08); border: 1px solid rgba(255,207,107,.3); }
  .typing { color: #7f95ba; font-size: 13px; font-style: italic; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 12px; }
  .chip {
    font-size: 12px; color: #bcccea; background: #13203a;
    border: 1px solid #26375a; border-radius: 999px; padding: 6px 11px; cursor: pointer;
  }
  .chip:hover { background: #18254040; border-color: var(--blue); }
  .input-row { display: flex; gap: 8px; padding: 12px 16px 16px; border-top: 1px solid var(--line); }
  input {
    flex: 1; font-size: 14px; padding: 11px 14px; border-radius: 10px;
    border: 1px solid #2b3c5e; background: var(--bg); color: var(--text); outline: none;
    font-family: inherit;
  }
  .send {
    font-weight: 700; font-size: 14px; color: #fff; background: var(--blue);
    border: none; border-radius: 10px; padding: 0 18px; cursor: pointer;
  }
  .caption {
    max-width: 620px; font-size: 12.5px; line-height: 1.6; color: var(--muted);
    text-align: center; padding: 0 8px;
  }
  .caption strong { color: var(--text); }
  @keyframes fade { from { opacity: 0; transform: translateY(6px);} to {opacity:1; transform:none;} }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="dot"></div>
      <div>
        <div class="h-title">Onboarding Assistant</div>
        <div class="h-sub">People Team · grounded Q&amp;A agent</div>
      </div>
      <div class="badge">BASIC</div>
    </div>
    <div class="chat" id="chat"></div>
    <div class="chips" id="chips"></div>
    <div class="input-row">
      <input id="input" placeholder="Ask an onboarding question…" />
      <button class="send" id="send">Send</button>
    </div>
  </div>
  <div class="caption">
    <strong>How it works:</strong> The agent is grounded in a single source of truth, answers only from it,
    cites the section it used, and routes any sensitive topic to a human. Trigger → grounding → action → human handoff.
  </div>

<script>
  // ---- Knowledge base (the grounding source) ----
  const KB = [
    { keys: ["insurance","health","medical","dental","vision","benefit","coverage"], topic: "Benefits",
      answer: "Your medical, dental, and vision coverage begins on your first day of employment. Open enrollment for changes happens each November." },
    { keys: ["401","retirement","match","invest"], topic: "Benefits",
      answer: "The company matches your 401(k) dollar-for-dollar up to the first 4% of salary. You can enroll after 30 days." },
    { keys: ["pay","paid","paycheck","payroll","salary","wage"], topic: "Pay",
      answer: "Payroll runs bi-weekly, every other Friday. Your first paycheck arrives within the first two pay cycles after your start date." },
    { keys: ["laptop","equipment","computer","badge","access","it ","device"], topic: "Equipment & Access",
      answer: "Your laptop and equipment ship to arrive on or before day one, and IT provisions your badge access within 24 hours of your start." },
    { keys: ["time off","pto","vacation","leave day","holiday","sick"], topic: "Time Off",
      answer: "You accrue PTO from day one. Submit time-off requests through the HR portal at least two weeks in advance when possible." },
  ];

  // ---- Sensitive topics (always route to a human) ----
  const SENSITIVE = ["accommodation","disability","medical leave","harassment","complaint","comp","compensation","someone's pay","performance review","fired","termination","severance","resign","quit","immigration","visa","legal","lawsuit","discrimination"];

  const SAMPLES = [
    "When does my health insurance start?",
    "How often do I get paid?",
    "When will my laptop arrive?",
    "How do I request time off?",
    "I need to request a medical accommodation.",
  ];

  const chat = document.getElementById("chat");
  const chips = document.getElementById("chips");
  const input = document.getElementById("input");
  const send = document.getElementById("send");

  function addBubble(role, text, tag) {
    const row = document.createElement("div");
    row.className = "row " + role;
    const bub = document.createElement("div");
    bub.className = "bubble";
    bub.innerHTML = text;
    if (tag) {
      const t = document.createElement("div");
      t.className = "tag " + tag.type;
      t.textContent = tag.text;
      bub.appendChild(t);
    }
    row.appendChild(bub);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
  }

  function addTyping() {
    const row = document.createElement("div");
    row.className = "row bot";
    row.id = "typing";
    row.innerHTML = '<div class="bubble"><span class="typing">thinking…</span></div>';
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
  }
  function removeTyping() {
    const t = document.getElementById("typing");
    if (t) t.remove();
  }

  function answer(q) {
    const lower = q.toLowerCase();
    // Check sensitive first — human handoff
    if (SENSITIVE.some(s => lower.includes(s))) {
      return {
        text: "This is something I want to make sure you get the right support on, so I'm connecting you with a human HR partner who will follow up with you directly. They'll have the full context.",
        tag: { type: "handoff", text: "→ Routed to human HR partner" }
      };
    }
    // Match knowledge base
    for (const item of KB) {
      if (item.keys.some(k => lower.includes(k.trim()))) {
        return { text: item.answer, tag: { type: "source", text: "Source: " + item.topic } };
      }
    }
    // No match — honest fallback
    return {
      text: "I don't have that in my onboarding knowledge yet. For this one, I'd reach out to your HR partner so you get an accurate answer.",
      tag: null
    };
  }

  function ask(q) {
    if (!q.trim()) return;
    addBubble("user", q);
    input.value = "";
    addTyping();
    setTimeout(() => {
      removeTyping();
      const a = answer(q);
      addBubble("bot", a.text, a.tag);
    }, 650);
  }

  SAMPLES.forEach(s => {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = s;
    b.onclick = () => ask(s);
    chips.appendChild(b);
  });

  send.onclick = () => ask(input.value);
  input.addEventListener("keydown", e => { if (e.key === "Enter") ask(input.value); });

  // greeting
  addBubble("bot", "Hi! I'm the onboarding assistant. Ask me anything about benefits, pay, equipment, or time off and I'll answer from our official policy. For anything sensitive, I'll connect you with a human HR partner.");
</script>
</body>
</html>
